name: Kaggle S6E7 Proven Ensemble

on:
  pull_request:
    branches: [main]
    paths:
      - "kaggle_s6e7_proven/**"
      - ".github/workflows/kaggle-s6e7-proven.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proven-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2.4" "pandas>=2.2" "scipy>=1.14" \
            "scikit-learn>=1.5" "lightgbm>=4.5"

      - name: Acquire and verify exact competition files
        run: |
          git clone --no-tags https://github.com/1644heihei/Kaggle_Predicting_Student_Health_Risk.git competition-mirror
          cd competition-mirror
          git checkout eb6228d4633f87aeb7861c6801664dd0df543390
          test "$(sha256sum data/train.csv | cut -d' ' -f1)" = "424d744d0344b14b7888b901d79db536f6ffbe73229809a736247ff812416fed"
          test "$(sha256sum data/test.csv | cut -d' ' -f1)" = "34914866109ab01c806adc25634fef1639d7574368a13d48ebe3037367365e01"

      - name: Run proven five-member ensemble
        run: |
          mkdir -p outputs_proven
          python kaggle_s6e7_proven/proven_pipeline.py \
            --data-dir competition-mirror/data \
            --output-dir outputs_proven \
            2>&1 | tee outputs_proven/proven.log

      - name: Summarize
        if: always()
        run: |
          echo "### Proven S6E7 ensemble" >> "$GITHUB_STEP_SUMMARY"
          if test -f outputs_proven/results_proven.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("outputs_proven/results_proven.json").read_text())
          print(f"- Recommended: `{r['recommended']['file']}` from {r['recommended']['source']}")
          print(f"- Equal blend OOF: {r['equal_blend']['balanced_accuracy']:.6f}")
          print(f"- Proven three-member OOF: {r['proven_three_member']['balanced_accuracy']:.6f}")
          print(f"- Optimized blend OOF: {r['optimized_blend']['balanced_accuracy']:.6f}")
          print(f"- Runtime: {r['elapsed_seconds']/60:.1f} minutes")
          PY
          else
            echo "- Pipeline failed before results were written" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-s6e7-proven-results
          path: outputs_proven/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
